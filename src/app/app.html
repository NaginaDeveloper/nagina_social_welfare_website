<app-header />
<main class="pb-24 sm:pb-0">
  <router-outlet />
</main>
@if (showDonateInvite()) {
  <app-donate-invite />
}
<app-footer />
@if (showFloatingWhatsapp() || showFloatingAssistant()) {
  <div
    class="fixed bottom-4 right-4 z-[70] flex flex-col items-center gap-3 sm:bottom-6 sm:right-6"
    aria-label="Quick contact"
  >
    @if (showFloatingWhatsapp()) {
      <app-floating-whatsapp />
    }
    @if (showFloatingAssistant()) {
      <app-assistant />
    }
  </div>
}
