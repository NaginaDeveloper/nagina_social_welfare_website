<app-header />
<main class="pb-24 sm:pb-0">
  <router-outlet />
</main>
@if (showDonateInvite()) {
  <app-donate-invite />
}
<app-footer />
@if (showFloatingWhatsapp() || showFloatingAssistant()) {
  <div
    class="fixed bottom-4 right-4 z-[70] flex flex-col items-center gap-3 sm:bottom-6 sm:right-6"
    aria-label="Quick contact"
  >
    @if (showFloatingWhatsapp()) {
      <app-floating-whatsapp />
    }
    @if (showFloatingAssistant()) {
      <!-- Loads when the browser is idle; a header "Ask" click before then is picked up on init. -->
      @defer (on idle) {
        <app-assistant />
      } @placeholder {
        <!-- Same size as the assistant button, so the WhatsApp button above it does not jump when it loads. -->
        <span class="block h-13 w-13" aria-hidden="true"></span>
      }
    }
  </div>
}
