<section id="events" class="relative overflow-hidden bg-sand py-24 sm:py-32">
  <div class="geo-pattern absolute inset-0 opacity-25" aria-hidden="true"></div>

  <div class="relative mx-auto max-w-6xl px-5 sm:px-8">
    <div class="mx-auto max-w-2xl text-center">
      <span class="mb-4 inline-block text-xs font-semibold uppercase tracking-[0.28em] text-gold-600">
        Events
      </span>
      <h2 class="font-display text-3xl font-bold leading-tight text-forest sm:text-4xl lg:text-5xl">
        Gatherings &amp;
        <span class="text-gold-gradient">announcements</span>
      </h2>
      <p class="mt-5 text-base leading-relaxed text-slate-warm sm:text-lg">
        {{ items.length }} event posters from Markaz Deen-e-Islam and Nagina Social
        Welfare — follow us for the latest programmes.
      </p>
    </div>

    <div class="mt-14 grid grid-cols-2 gap-3 sm:gap-4 md:grid-cols-3 lg:grid-cols-4">
      @for (item of items; track item.id) {
        <button
          type="button"
          class="group relative aspect-[3/4] overflow-hidden rounded-2xl bg-white shadow-soft ring-1 ring-mist transition-all duration-500 hover:-translate-y-1 hover:ring-gold/40 hover:shadow-portal focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gold"
          (click)="openItem(item)"
          [attr.aria-label]="'View: ' + item.caption"
        >
          <img
            [src]="item.src"
            [alt]="item.alt"
            class="h-full w-full object-cover object-top transition-transform duration-700 group-hover:scale-105"
            loading="lazy"
            decoding="async"
          />
          <span
            class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-forest/90 to-transparent px-2.5 pb-2.5 pt-8 text-left text-[0.65rem] font-medium leading-snug text-cream opacity-100 transition-opacity duration-300 sm:px-3 sm:pb-3 sm:pt-10 sm:text-xs sm:opacity-0 sm:group-hover:opacity-100"
          >
            {{ item.caption }}
          </span>
        </button>
      }
    </div>

    <div class="mt-14 flex flex-col items-center justify-center gap-3 sm:flex-row">
      <a
        [href]="instagramUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-gold-300 to-gold px-7 py-3.5 text-sm font-semibold text-forest shadow-soft transition-all duration-300 hover:brightness-105"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm10 2H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3Zm-5 3.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 0 1 12 7.5Zm0 2A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5Zm5.25-3.75a1 1 0 1 1-1 1 1 1 0 0 1 1-1Z" />
        </svg>
        @naginasocialwelfare
      </a>
      <a
        [href]="facebookUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 rounded-full border border-forest/15 bg-white px-7 py-3.5 text-sm font-semibold text-forest transition-all duration-300 hover:border-gold/40 hover:text-gold-600"
      >
        Facebook
      </a>
      <a
        [href]="facebookPhotosUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 rounded-full border border-forest/15 bg-white px-7 py-3.5 text-sm font-semibold text-forest transition-all duration-300 hover:border-gold/40 hover:text-gold-600"
      >
        More on Facebook
      </a>
      <a
        [href]="youtubeUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 rounded-full border border-forest/15 bg-white px-7 py-3.5 text-sm font-semibold text-forest transition-all duration-300 hover:border-gold/40 hover:text-gold-600"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.5 31.5 0 0 0 0 12a31.5 31.5 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.5 31.5 0 0 0 24 12a31.5 31.5 0 0 0-.5-5.8ZM9.8 15.5v-7l6.3 3.5-6.3 3.5Z" />
        </svg>
        YouTube
      </a>
    </div>
  </div>
</section>

@if (activeItem(); as item) {
  <div
    class="fixed inset-0 z-[80] flex items-center justify-center bg-forest/90 p-4 backdrop-blur-md sm:p-8"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="item.caption"
    (click)="closeItem()"
  >
    <button
      type="button"
      class="absolute right-4 top-4 z-10 flex h-11 w-11 items-center justify-center rounded-full border border-cream/20 bg-white/10 text-cream transition-colors hover:border-gold/50 hover:bg-white/15 hover:text-gold-300 sm:right-8 sm:top-8"
      (click)="closeItem(); $event.stopPropagation()"
      aria-label="Close event poster"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>

    <figure
      class="relative flex max-h-full w-full max-w-3xl flex-col items-center"
      (click)="$event.stopPropagation()"
    >
      <img
        [src]="item.src"
        [alt]="item.alt"
        class="max-h-[min(85vh,900px)] w-auto max-w-full rounded-xl object-contain shadow-portal ring-1 ring-white/15"
      />
      <figcaption class="mt-4 text-center text-sm text-cream/80 sm:text-base">
        {{ item.caption }}
      </figcaption>
    </figure>
  </div>
}
