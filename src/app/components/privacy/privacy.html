<section id="privacy" class="relative overflow-hidden bg-cream py-24 sm:py-32">
  <div class="geo-pattern absolute inset-0 opacity-15" aria-hidden="true"></div>

  <div class="relative mx-auto max-w-3xl px-5 sm:px-8">
    <div class="text-center">
      <span class="mb-4 inline-block text-xs font-semibold uppercase tracking-[0.28em] text-gold-600">
        Legal
      </span>
      <h2 class="font-display text-3xl font-bold leading-tight text-forest sm:text-4xl lg:text-5xl">
        Privacy
        <span class="text-gold-gradient">notice</span>
      </h2>
      <p class="mt-5 text-base leading-relaxed text-slate-warm sm:text-lg">
        How Nagina Social Welfare handles information when you use this website.
      </p>
      <p class="mt-3 text-xs font-medium uppercase tracking-[0.18em] text-slate-warm/80">
        Last updated · {{ updated }}
      </p>
    </div>

    <div class="mt-12 space-y-8 rounded-[1.75rem] border border-mist bg-white px-6 py-8 shadow-soft sm:px-10 sm:py-10">
      @for (block of blocks; track block.title) {
        <article>
          <h3 class="font-display text-xl font-bold text-forest sm:text-2xl">
            {{ block.title }}
          </h3>
          <p class="mt-2.5 text-sm leading-relaxed text-slate-warm sm:text-base">
            {{ block.body }}
          </p>
        </article>
      }
    </div>

    <p class="mt-6 text-center text-xs text-slate-warm/80">
      Questions?
      <a href="mailto:info@naginasocialwelfare.co.uk" class="font-medium text-gold-600 hover:underline">
        info&#64;naginasocialwelfare.co.uk
      </a>
    </p>
  </div>
</section>
