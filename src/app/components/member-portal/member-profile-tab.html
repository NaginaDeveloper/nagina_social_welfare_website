<form
  id="member-panel-profile"
  role="tabpanel"
  aria-labelledby="member-tab-profile"
  [class]="portalCardClass + ' mt-8 space-y-5'"
  (submit)="submitProfile($event)"
>
  <h2 class="font-display text-xl font-bold text-forest">{{ i18n.t('memberHome.profile') }}</h2>

  <div class="grid gap-4 sm:grid-cols-2">
    <label class="block text-sm font-medium text-forest sm:col-span-2">
      {{ i18n.t('membership.fullName') }}
      <input type="text" [class]="portalInputClass + ' bg-sand/60'" [value]="member().fullName" readonly />
    </label>
    <label class="block text-sm font-medium text-forest sm:col-span-2">
      {{ i18n.t('membership.email') }}
      <input type="email" [class]="portalInputClass + ' bg-sand/60'" [value]="member().email" readonly />
    </label>
  </div>

  <label class="block text-sm font-medium text-forest">
    {{ i18n.t('membership.phone') }}
    <input
      type="tel"
      [class]="portalInputClass"
      [(ngModel)]="phone"
      name="phone"
      autocomplete="tel"
      [class.border-red-400]="phoneError()"
    />
    <p class="mt-1.5 text-xs text-slate-warm">{{ i18n.t('apply.phoneHint') }}</p>
    @if (phoneError(); as msg) {
      <p class="mt-1 text-xs text-red-700">{{ msg }}</p>
    }
  </label>

  <div class="space-y-4 border-t border-mist pt-6">
    <h3 class="font-display text-lg font-bold text-forest">{{ i18n.t('memberHome.addressSection') }}</h3>
    <label class="block text-sm font-medium text-forest">
      {{ i18n.t('membership.address1') }}
      <input type="text" [class]="portalInputClass" [(ngModel)]="addressLine1" name="line1" />
    </label>
    <label class="block text-sm font-medium text-forest">
      {{ i18n.t('membership.address2') }}
      <input type="text" [class]="portalInputClass" [(ngModel)]="addressLine2" name="line2" />
    </label>
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="block text-sm font-medium text-forest">
        {{ i18n.t('membership.city') }}
        <input type="text" [class]="portalInputClass" [(ngModel)]="addressCity" name="city" />
      </label>
      <label class="block text-sm font-medium text-forest">
        {{ i18n.t('membership.postcode') }}
        <input type="text" [class]="portalInputClass" [(ngModel)]="addressPostcode" name="postcode" />
      </label>
    </div>
  </div>

  <div class="space-y-4 border-t border-mist pt-6">
    <h3 class="font-display text-lg font-bold text-forest">{{ i18n.t('memberHome.interestsSection') }}</h3>
    <fieldset class="space-y-2">
      <legend class="text-sm font-medium text-forest">{{ i18n.t('membership.volunteerInterests') }}</legend>
      @for (opt of interestOptions; track opt.value) {
        <label class="flex cursor-pointer items-start gap-3 rounded-2xl border border-mist px-4 py-3 transition-colors hover:border-gold/30">
          <input
            type="checkbox"
            class="mt-1 accent-[#022c22]"
            [checked]="interestChecked(opt.value)"
            (change)="toggleInterest(opt.value, $any($event.target).checked)"
          />
          <span class="text-sm text-forest">{{ i18n.t(opt.labelKey) }}</span>
        </label>
      }
    </fieldset>
    <label class="block text-sm font-medium text-forest">
      {{ i18n.t('membership.skills') }}
      <textarea
        [class]="portalInputClass + ' min-h-24 py-3'"
        [(ngModel)]="skills"
        name="skills"
      ></textarea>
    </label>
    <label class="block text-sm font-medium text-forest">
      {{ i18n.t('membership.languages') }}
      <textarea
        [class]="portalInputClass + ' min-h-20 py-3'"
        [(ngModel)]="languages"
        name="languages"
      ></textarea>
    </label>
    @if (heardAbout) {
      <label class="block text-sm font-medium text-forest">
        {{ i18n.t('membership.heardAbout') }}
        <input type="text" [class]="portalInputClass + ' bg-sand/60'" [value]="heardAbout" readonly />
      </label>
    }
  </div>

  <label class="flex items-start gap-3 rounded-2xl border border-mist px-4 py-3">
    <input type="checkbox" class="mt-1 accent-[#022c22]" [(ngModel)]="marketingOptIn" name="marketingOptIn" />
    <span class="text-sm text-forest">{{ i18n.t('membership.consentMarketing') }}</span>
  </label>

  @if (saved()) {
    <p [class]="portalSuccessBannerClass">{{ i18n.t('memberHome.saved') }}</p>
  }

  <button type="submit" [disabled]="saving()" [class]="portalPrimaryBtnClass">
    {{ saving() ? i18n.t('memberHome.saving') : i18n.t('memberHome.save') }}
  </button>
</form>
