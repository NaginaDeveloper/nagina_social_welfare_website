<section id="ahle-bait" class="relative overflow-hidden bg-cream py-24 sm:py-32">
  <div class="geo-pattern absolute inset-0 opacity-20" aria-hidden="true"></div>

  <div class="relative mx-auto max-w-6xl px-5 sm:px-8">
    <div class="mx-auto max-w-3xl text-center">
      <span class="mb-4 inline-block text-xs font-semibold uppercase tracking-[0.28em] text-gold-600">
        Ahle Bait-e-Athaar
      </span>
      <p
        class="font-arabic text-2xl leading-relaxed text-forest sm:text-3xl"
        lang="ur"
        dir="rtl"
      >
        اہلِ بیتِ اطہار
      </p>
      <h1 class="mt-3 font-display text-3xl font-bold leading-tight text-forest sm:text-4xl lg:text-5xl">
        Honouring
        <span class="text-gold-gradient">Aal-e-Pak</span>
      </h1>
      <p class="mt-5 text-base leading-relaxed text-slate-warm sm:text-lg">
        Brief words from the Prophet ﷺ on the rank of his blessed family —
        a light we hold dear alongside the Qur&rsquo;an.
      </p>
    </div>

    <figure class="mx-auto mt-12 max-w-4xl">
      <div class="overflow-hidden rounded-2xl bg-sand shadow-soft ring-1 ring-mist">
        <img
          src="media/shan-ahle-bait.jpg"
          alt="Shan Ahle Bait — the dignity of the Prophet’s household in the light of Quran and Hadith, with Al-Masjid an-Nabawi"
          width="1024"
          height="558"
          class="w-full object-cover"
          loading="eager"
          decoding="async"
        />
      </div>
      <figcaption class="mt-3 text-center text-sm text-slate-warm">
        Shan Ahle Bait — greatness of the Ahl al-Bayt in Quran and Hadith
      </figcaption>
    </figure>

    <div class="mt-14 grid gap-6 md:grid-cols-2">
      @for (hadith of ahadith; track hadith.title) {
        <blockquote
          class="rounded-2xl border border-mist border-l-4 border-l-gold bg-white/80 px-6 py-7 shadow-soft sm:px-8"
        >
          <p class="text-xs font-semibold uppercase tracking-[0.2em] text-gold-600">
            {{ hadith.title }}
          </p>
          <p class="mt-4 font-display text-xl leading-relaxed text-forest sm:text-2xl">
            &ldquo;{{ hadith.text }}&rdquo;
          </p>
          <footer class="mt-5 text-sm text-slate-warm">{{ hadith.source }}</footer>
        </blockquote>
      }
    </div>
  </div>
</section>
