<section id="guidance" class="relative overflow-hidden bg-cream py-24 sm:py-32">
  <div class="geo-pattern absolute inset-0 opacity-20" aria-hidden="true"></div>

  <div class="relative mx-auto max-w-6xl px-5 sm:px-8">
    <div
      class="mx-auto max-w-5xl text-center"
      [attr.dir]="i18n.isUr() ? 'rtl' : null"
      [attr.lang]="i18n.isUr() ? 'ur' : null"
    >
      <span class="mb-4 inline-block text-xs font-semibold uppercase tracking-[0.28em] text-gold-600">
        {{ i18n.t('guidance.eyebrow') }}
      </span>
      <h1 class="font-display text-3xl font-bold leading-tight text-forest sm:text-4xl lg:whitespace-nowrap lg:text-5xl">
        {{ i18n.t('guidance.title') }}
        <span class="text-gold-gradient">{{ i18n.t('guidance.titleAccent') }}</span>
      </h1>
      <p class="mx-auto mt-5 max-w-3xl text-base leading-relaxed text-slate-warm sm:text-lg">
        {{ i18n.t('guidance.lead') }}
      </p>

      <div class="mt-8 flex flex-col items-center gap-3">
        <span
          class="flex h-16 w-16 overflow-hidden rounded-full bg-white p-0.5 shadow-soft ring-2 ring-gold/35"
        >
          <img
            src="brand/munir-ahmed-yusufi.jpg"
            alt="Allama Munir Ahmed Yusufi"
            width="64"
            height="64"
            class="h-full w-full rounded-full object-cover object-top"
            loading="lazy"
            decoding="async"
          />
        </span>
        <p class="text-sm font-medium text-forest">
          {{ i18n.t('guidance.teachingsOf') }}
          <span class="text-gold-gradient">Munir-e-Islam</span>
        </p>
      </div>
    </div>

    <div class="mt-12 grid items-stretch gap-8 lg:grid-cols-2">
      @for (poster of posters; track poster.id) {
        <figure class="group flex h-full flex-col">
          <button
            type="button"
            class="relative flex h-full w-full flex-col overflow-hidden rounded-3xl border border-mist bg-gradient-to-b from-sand to-cream p-4 text-left shadow-soft transition-all duration-500 hover:-translate-y-1.5 hover:border-gold/40 hover:shadow-portal focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gold sm:p-5"
            (click)="openPoster(poster)"
            [attr.aria-label]="i18n.t('guidance.viewFull') + ': ' + i18n.pick(poster.title, poster.titleUr)"
          >
            <span
              class="pointer-events-none absolute inset-x-10 top-0 h-px bg-gradient-to-r from-transparent via-gold/50 to-transparent opacity-0 transition-opacity duration-500 group-hover:opacity-100"
              aria-hidden="true"
            ></span>

            <span
              class="relative flex min-h-[16rem] flex-1 items-center justify-center overflow-hidden rounded-2xl bg-white ring-1 ring-mist sm:min-h-[22rem] lg:min-h-[28rem]"
            >
              <img
                [src]="poster.src"
                [alt]="poster.alt"
                [width]="poster.width"
                [height]="poster.height"
                class="max-h-[20rem] w-full object-contain transition-transform duration-700 group-hover:scale-[1.02] sm:max-h-[28rem] lg:max-h-[32rem]"
                loading="lazy"
                decoding="async"
              />
            </span>

            <span
              class="mt-4 flex items-center justify-center gap-2 text-xs font-medium uppercase tracking-[0.18em] text-slate-warm/80 transition-colors duration-300 group-hover:text-gold-600"
            >
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
              </svg>
              {{ i18n.t('guidance.viewFull') }}
            </span>
          </button>

          <figcaption
            class="mt-5 px-2 text-center"
            [attr.dir]="i18n.isUr() ? 'rtl' : null"
            [attr.lang]="i18n.isUr() ? 'ur' : null"
          >
            <h3 class="font-display text-xl font-bold text-forest sm:text-2xl">
              {{ i18n.pick(poster.title, poster.titleUr) }}
            </h3>
            <p class="mt-1.5 text-sm text-slate-warm">
              {{ i18n.pick(poster.subtitle, poster.subtitleUr) }}
            </p>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>

@if (activePoster(); as poster) {
  <div
    class="fixed inset-0 z-[80] flex items-center justify-center bg-forest/90 p-4 backdrop-blur-md sm:p-8"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="i18n.pick(poster.title, poster.titleUr)"
    (click)="closePoster()"
  >
    <button
      type="button"
      class="absolute right-4 top-4 z-10 flex h-11 w-11 items-center justify-center rounded-full border border-cream/20 bg-white/10 text-cream transition-colors hover:border-gold/50 hover:bg-white/15 hover:text-gold-300 sm:right-8 sm:top-8"
      (click)="closePoster(); $event.stopPropagation()"
      [attr.aria-label]="i18n.t('guidance.close')"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>

    <figure
      class="relative flex max-h-full w-full max-w-3xl flex-col items-center"
      (click)="$event.stopPropagation()"
    >
      <img
        [src]="poster.src"
        [alt]="poster.alt"
        [width]="poster.width"
        [height]="poster.height"
        class="max-h-[min(85vh,900px)] w-auto max-w-full rounded-xl object-contain shadow-portal ring-1 ring-white/15"
      />
      <figcaption
        class="mt-4 text-center"
        [attr.dir]="i18n.isUr() ? 'rtl' : null"
      >
        <p class="font-display text-lg font-semibold text-cream sm:text-xl">
          {{ i18n.pick(poster.title, poster.titleUr) }}
        </p>
        <p class="mt-1 text-sm text-cream/65">
          {{ i18n.pick(poster.subtitle, poster.subtitleUr) }}
        </p>
      </figcaption>
    </figure>
  </div>
}
