<div class="mt-9 flex w-full max-w-sm flex-col items-stretch gap-3 sm:max-w-none sm:flex-row sm:items-center sm:justify-center">
  <a routerLink="/donate" class="btn btn-lg btn-primary shadow-portal transition-transform duration-300 hover:-translate-y-0.5">
    <app-icon name="donate" size="h-5 w-5" [strokeWidth]="2" />
    {{ i18n.t('header.donate') }}
  </a>
  <a routerLink="/namaz" class="btn btn-lg btn-secondary transition-transform duration-300 hover:-translate-y-0.5">
    <app-icon name="mosque" size="h-5 w-5" />
    {{ i18n.t('hero.namaz') }}
  </a>
  <a routerLink="/apply" class="btn btn-lg btn-secondary transition-transform duration-300 hover:-translate-y-0.5">
    <app-icon name="contact" size="h-5 w-5" />
    {{ i18n.t('hero.apply') }}
  </a>
</div>
