@if (variant() === 'hero') {
  <div class="mt-6 grid w-full max-w-sm grid-cols-1 gap-3 sm:max-w-none sm:flex sm:flex-row sm:flex-wrap sm:items-center sm:justify-center">
    <a
      routerLink="/donate"
      class="inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-full bg-gradient-to-r from-gold-300 to-gold px-7 py-3 font-semibold text-forest shadow-portal transition-all duration-300 hover:brightness-105 sm:w-auto"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 0 1 6.364 0L12 7.636l1.318-1.318a4.5 4.5 0 1 1 6.364 6.364L12 20.364l-7.682-7.682a4.5 4.5 0 0 1 0-6.364Z" />
      </svg>
      {{ i18n.t('header.donate') }}
    </a>
    <a
      routerLink="/namaz"
      class="inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-full border border-gold/55 bg-white/10 px-7 py-3 font-semibold text-gold-300 shadow-soft transition-all duration-300 hover:border-gold hover:bg-white/15 sm:w-auto"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 20V11l8-6 8 6v9" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 20v-5h6v5M12 5V3.5" />
      </svg>
      {{ i18n.t('hero.namaz') }}
    </a>
    <a
      [href]="org.quizUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="group inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-full border border-gold/55 bg-white/10 px-7 py-3 font-semibold text-gold-300 shadow-soft transition-all duration-300 hover:border-gold hover:bg-white/15 sm:w-auto"
      [attr.aria-label]="i18n.t('hero.quizAria')"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 9h.01M15 9h.01M9.5 13a3.5 3.5 0 0 0 5 0" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z" />
      </svg>
      {{ i18n.t('hero.quiz') }}
    </a>
    <a
      [href]="org.halalCheckerUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="group inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-full border border-gold/55 bg-white/10 px-7 py-3 font-semibold text-gold-300 shadow-soft transition-all duration-300 hover:border-gold hover:bg-white/15 sm:w-auto"
      [attr.aria-label]="i18n.t('hero.halalCheckerAria')"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" d="M4 7v10M7 7v10M9 7v10M12 7v10M14 7v10M17 7v10M20 7v10" />
      </svg>
      {{ i18n.t('hero.halalChecker') }}
    </a>
    <button
      type="button"
      class="inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-full border border-gold/55 bg-white/10 px-7 py-3 font-semibold text-gold-300 shadow-soft transition-all duration-300 hover:border-gold hover:bg-white/15 sm:w-auto"
      [attr.aria-label]="i18n.t('hero.assistantAria')"
      (click)="openAssistant()"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8M8 14h5" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 5h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-4l-4 3v-3H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" />
      </svg>
      {{ i18n.t('hero.assistant') }}
    </button>
  </div>
} @else {
  <div class="flex flex-wrap items-center gap-2 pb-3 xl:hidden">
    <a
      routerLink="/donate"
      class="inline-flex min-h-9 items-center justify-center gap-1.5 rounded-full bg-gradient-to-r from-gold-300 to-gold px-3 py-1.5 text-xs font-semibold text-forest shadow-soft"
    >
      <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 0 1 6.364 0L12 7.636l1.318-1.318a4.5 4.5 0 1 1 6.364 6.364L12 20.364l-7.682-7.682a4.5 4.5 0 0 1 0-6.364Z" />
      </svg>
      {{ i18n.t('header.donateShort') }}
    </a>
    <a
      routerLink="/namaz"
      class="inline-flex min-h-9 items-center justify-center gap-1.5 rounded-full border border-gold/40 bg-white px-3 py-1.5 text-xs font-semibold text-forest shadow-soft"
    >
      <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 20V11l8-6 8 6v9" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 20v-5h6v5M12 5V3.5" />
      </svg>
      {{ i18n.t('hero.namaz') }}
    </a>
    <a
      [href]="org.quizUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex min-h-9 items-center justify-center gap-1.5 rounded-full border border-gold/40 bg-white px-3 py-1.5 text-xs font-semibold text-forest shadow-soft"
      [attr.aria-label]="i18n.t('hero.quizAria')"
    >
      <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 9h.01M15 9h.01M9.5 13a3.5 3.5 0 0 0 5 0" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z" />
      </svg>
      {{ i18n.t('header.quizShort') }}
    </a>
    <a
      [href]="org.halalCheckerUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex min-h-9 items-center justify-center gap-1.5 rounded-full border border-gold/40 bg-white px-3 py-1.5 text-xs font-semibold text-forest shadow-soft"
      [attr.aria-label]="i18n.t('hero.halalCheckerAria')"
    >
      <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" d="M4 7v10M7 7v10M9 7v10M12 7v10M14 7v10M17 7v10M20 7v10" />
      </svg>
      {{ i18n.t('header.halalCheckerShort') }}
    </a>
    <button
      type="button"
      class="inline-flex min-h-9 items-center justify-center gap-1.5 rounded-full border border-gold/40 bg-white px-3 py-1.5 text-xs font-semibold text-forest shadow-soft"
      [attr.aria-label]="i18n.t('hero.assistantAria')"
      (click)="openAssistant()"
    >
      <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8M8 14h5" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 5h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-4l-4 3v-3H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" />
      </svg>
      {{ i18n.t('header.assistantShort') }}
    </button>
  </div>
}
